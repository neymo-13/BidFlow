spring:
  application:
    name: backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/auction_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Migration ของ DB: init-scripts/schema.sql = version 1 (baseline) แล้ว Flyway รัน V2, V3, ... ต่อเอง
  # DB ที่มีข้อมูลอยู่แล้วแต่ยังไม่มีตาราง flyway_schema_history จะถูก baseline ที่ version 1 ก่อน
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "init-scripts/schema.sql"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL:false}

  # อัปโหลดรูปสินค้า: ไฟล์ละไม่เกิน 5 MB
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# ไฟล์ที่เกินขนาด: ให้ Tomcat อ่าน body ที่เหลือทิ้ง (สูงสุด 10 MB) ก่อนตอบ 413
# ค่าเริ่มต้น 2 MB จะตัด connection ทันที ทำให้บางครั้ง client ไม่ได้รับ 413 และค้างรอ
server:
  tomcat:
    max-swallow-size: 10MB

app:
  jwt:
    # DEV ONLY — production ต้องเก็บใน env var
    # ต้อง Base64 encode + ยาวอย่างน้อย 32 bytes
    # secret: "ZGV2LW9ubHktc2VjcmV0LWtleS1mb3ItYmlkZmxvdy1hdWN0aW9uLXByb2plY3Q="
    # expiration-ms: 86400000   # 24 ชั่วโมง = 24 * 60 * 60 * 1000
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
      allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

  # admin คนแรก (AdminBootstrap) — ตั้งผ่าน env เท่านั้น ห้ามใส่ค่าจริงในไฟล์นี้ · username ว่าง = ข้าม
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

  # Google sign-in — OAuth Client ID (ไม่ใช่ความลับ) จาก env · ว่าง = ปิด Google sign-in
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

  # Object storage (S3 / S3-compatible) — ตั้งค่าผ่าน env เท่านั้น
  # STORAGE_ENDPOINT ว่าง = AWS S3 จริง · STORAGE_ACCESS_KEY/SECRET_KEY ว่าง = AWS default credentials (เช่น IAM role)
  storage:
    bucket: ${STORAGE_BUCKET:bidflow-auction}
    region: ${STORAGE_REGION:ap-southeast-1}
    endpoint: ${STORAGE_ENDPOINT:}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style: ${STORAGE_PATH_STYLE:false}
    url-expiry-minutes: ${STORAGE_URL_EXPIRY_MINUTES:60}

logging:
  level:
    com.bidflow.backend: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:WARN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
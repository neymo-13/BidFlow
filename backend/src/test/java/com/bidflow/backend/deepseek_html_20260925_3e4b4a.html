<!DOCTYPE html>
<html>
<head>
    <title>BidFlow WS Test</title>
</head>
<body>
    <h1>BidFlow WebSocket Test</h1>
    <div id="status">Disconnected</div>
    <ul id="messages"></ul>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script>
        const socket = new SockJS('http://localhost:8080/ws');
        const stompClient = Stomp.over(socket);

        stompClient.connect({}, function(frame) {
            document.getElementById('status').innerText = 'Connected: ' + frame;
            
            stompClient.subscribe('/topic/auctions/1', function(message) {
                const data = JSON.parse(message.body);
                const li = document.createElement('li');
                li.innerText = `${data.bidderUsername} bid ${data.amount} (seq ${data.sequence})`;
                document.getElementById('messages').appendChild(li);
            });
        });
    </script>
</body>
</html>

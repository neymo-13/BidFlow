spring:
  application:
    name: backend

  datasource:
    # ใช้ชื่อ container แทน localhost
    url: jdbc:postgresql://postgres-db:5432/auction_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false                 # ปิด SQL log ใน Docker
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      # ใช้ชื่อ container
      host: redis
      port: 6379

app:
  jwt:
    secret: "ZGV2LW9ubHktc2VjcmV0LWtleS1mb3ItYmlkZmxvdy1hdWN0aW9uLXByb2plY3Q="
    expiration-ms: 86400000

logging:
  level:
    com.bidflow.backend: INFO
    org.hibernate.SQL: WARN
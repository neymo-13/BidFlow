spring.application.name=auction-backend

# ชี้ไปที่ PostgreSQL ใน Docker (Port 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/auction_db
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# ให้ Spring Boot สร้าง/อัปเดต ตารางใน DB ตามโค้ด Java อัตโนมัติ
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
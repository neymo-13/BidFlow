spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/auction_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    # DEV ONLY — production ต้องเก็บใน env var
    # ต้อง Base64 encode + ยาวอย่างน้อย 32 bytes
    secret: "ZGV2LW9ubHktc2VjcmV0LWtleS1mb3ItYmlkZmxvdy1hdWN0aW9uLXByb2plY3Q="
    expiration-ms: 86400000   # 24 ชั่วโมง = 24 * 60 * 60 * 1000
services:
  postgres-db:
    image: postgres:16-alpine
    container_name: auction-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auction_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auction_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bidflow-network

  redis:
    image: redis:7-alpine
    container_name: auction-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bidflow-network

  # S3-compatible object storage for item images (dev only).
  # Production uses AWS S3 instead: leave STORAGE_ENDPOINT empty and use real credentials / an IAM role.
  object-storage:
    image: adobe/s3mock:5.2.3
    container_name: auction-object-storage
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - object_storage_data:/s3mockroot
    networks:
      - bidflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auction-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      STORAGE_BUCKET: bidflow-images
      STORAGE_REGION: us-east-1
      STORAGE_ENDPOINT: http://object-storage:9090      # address inside the Docker network
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9090    # address the browser uses for image URLs
      STORAGE_PATH_STYLE: "true"
      # Dummy dev-only keys: s3mock does not check credentials (same idea as the Postgres password above)
      STORAGE_ACCESS_KEY: dev-access-key
      STORAGE_SECRET_KEY: dev-secret-key
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_started
    networks:
      - bidflow-network

volumes:
  postgres_data:
  redis_data:
  object_storage_data:

networks:
  bidflow-network:
    driver: bridge